<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MLdle — Dev Arcade</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔤</text></svg>" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .board { display: grid; grid-template-rows: repeat(6, 1fr); gap: 8px; margin: 0 auto 28px; width: min(100%, 320px); }
    .board-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
    .cell {
      aspect-ratio: 1;
      display: flex; align-items: center; justify-content: center;
      border: 2px solid rgba(255,255,255,0.15);
      border-radius: 6px;
      font-family: 'Press Start 2P', monospace;
      font-size: 18px;
      background: var(--bg-panel);
      text-transform: uppercase;
      transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
    }
    .cell.filled { border-color: rgba(255,255,255,0.35); }
    .cell.correct { background: var(--green); border-color: var(--green); color: #06070a; }
    .cell.present { background: var(--yellow); border-color: var(--yellow); color: #06070a; }
    .cell.absent { background: #1a1e28; border-color: #1a1e28; color: var(--text-dim); }
    .cell.flip { animation: flip 0.4s ease; }
    @keyframes flip { 0% { transform: rotateX(0); } 50% { transform: rotateX(90deg); } 100% { transform: rotateX(0); } }
    .shake { animation: shake 0.3s ease; }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

    .kb { display: flex; flex-direction: column; gap: 7px; max-width: 460px; margin: 0 auto; }
    .kb-row { display: flex; gap: 6px; justify-content: center; }
    .key {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 12px;
      border: none;
      border-radius: 6px;
      background: #1c202b;
      color: var(--text);
      padding: 14px 0;
      flex: 1;
      min-width: 26px;
      cursor: pointer;
      text-transform: uppercase;
    }
    .key:hover { background: #262c3a; }
    .key { transition: transform 0.08s ease, background 0.12s ease; }
    .key:active { transform: scale(0.9); }
    .cell.pop { animation: pop 0.1s ease; }
    @keyframes pop { 50% { transform: scale(1.08); } }
    .key.wide { flex: 1.6; font-size: 10px; }
    .key.correct { background: var(--green); color: #06070a; }
    .key.present { background: var(--yellow); color: #06070a; }
    .key.absent { background: #0f1219; color: #45506a; }
  </style>
</head>
<body>
  <div class="grid-bg" aria-hidden="true"></div>
  <header class="topbar">
    <a class="logo pixel" href="index.html">👾 DEV_ARCADE</a>
    <a class="back" href="index.html">← ARCADE</a>
  </header>

  <main>
    <div class="game-shell">
      <h1 class="game-title" style="color: var(--green)">🔤 MLDLE</h1>
      <p class="game-sub">Guess today's 5-letter AI/ML term in 6 tries. One word a day, same for everyone.</p>

      <div id="board" class="board"></div>
      <div id="kb" class="kb"></div>

      <div id="result-panel" class="panel center" style="margin-top: 20px;" hidden>
        <p class="pixel" id="result-title" style="font-size: 15px; margin-bottom: 12px;"></p>
        <pre id="share-grid" style="font-size: 20px; line-height: 1.3; margin: 0 0 18px; background: none; border: none;"></pre>
        <div class="row">
          <button id="copy-btn" class="btn btn-green">📋 COPY RESULT</button>
          <a class="btn btn-ghost" href="index.html">ARCADE</a>
        </div>
      </div>
    </div>
  </main>

  <script src="shared.js"></script>
  <script src="mldle-data.js"></script>
  <script src="mldle.js"></script>
</body>
</html>
