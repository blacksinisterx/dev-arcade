<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Root Access — Dev Arcade</title>
  <meta name="description" content="A real interactive fake terminal -- navigate a virtual filesystem with real commands (ls, cd, cat, grep, find) to find the hidden flag." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💻</text></svg>" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .term-wrap {
      background: #030405;
      border: 1px solid rgba(57,255,136,0.3);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 0 30px -10px rgba(57,255,136,0.25);
    }
    .term-bar {
      display: flex; align-items: center; gap: 7px;
      padding: 10px 12px;
      background: #0a0b10;
      border-bottom: 1px solid rgba(57,255,136,0.2);
    }
    .term-dot { width: 10px; height: 10px; border-radius: 50%; }
    .term-dot.r { background: #ff5f56; } .term-dot.y { background: #ffbd2e; } .term-dot.g { background: #27c93f; }
    .term-label { margin-left: 8px; font-size: 11px; color: #4a4f5c; }
    #term-output {
      height: 340px;
      overflow-y: auto;
      padding: 14px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      line-height: 1.6;
      color: var(--green);
      white-space: pre-wrap;
      word-break: break-word;
    }
    #term-output .cmd-line { color: var(--text); }
    #term-output .prompt-tag { color: var(--cyan); }
    #term-output .err { color: var(--magenta); }
    #term-output .hint { color: var(--yellow); }
    .term-input-row {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 14px;
      border-top: 1px solid rgba(57,255,136,0.15);
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
    }
    #term-prompt { color: var(--cyan); white-space: nowrap; }
    #term-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: inherit;
      font-size: inherit;
    }
  </style>
</head>
<body>
  <div class="grid-bg" aria-hidden="true"></div>
  <header class="topbar">
    <a class="logo pixel" href="index.html">👾 DEV_ARCADE</a>
    <a class="back" href="index.html">← ARCADE</a>
  </header>

  <main>
    <div class="game-shell" style="max-width: 640px;">
      <h1 class="game-title" style="color: var(--green)">💻 ROOT ACCESS</h1>
      <p class="game-sub">A real virtual filesystem. Find the hidden flag on each level using real commands. Type <code>help</code> to see them.</p>

      <div class="hud">
        <span>LEVEL <span class="val" id="level-val">1</span>/4</span>
        <span>BEST <span class="val" id="best-val">0</span></span>
      </div>

      <div class="term-wrap">
        <div class="term-bar">
          <span class="term-dot r"></span><span class="term-dot y"></span><span class="term-dot g"></span>
          <span class="term-label">guest@arcade: ~</span>
        </div>
        <div id="term-output"></div>
        <div class="term-input-row">
          <span id="term-prompt">guest@arcade:~$</span>
          <input id="term-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" />
        </div>
      </div>

      <div id="over-row" class="row" style="margin-top: 20px;" hidden>
        <button id="retry-btn" class="btn btn-green">↻ RESTART</button>
        <a class="btn btn-ghost" href="index.html">ARCADE</a>
      </div>
    </div>
  </main>

  <script src="shared.js"></script>
  <script src="terminal-data.js"></script>
  <script src="terminal.js"></script>
</body>
</html>
