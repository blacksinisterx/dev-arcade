<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Code Golf — Dev Arcade</title>
  <meta name="description" content="Write the shortest working JavaScript that passes real test cases. Runs safely sandboxed in a Web Worker with a timeout." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⛳</text></svg>" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .challenge-panel { padding: 24px; margin-bottom: 18px; }
    .challenge-title { font-family: 'Press Start 2P', monospace; font-size: 15px; color: var(--yellow); margin: 0 0 10px; }
    .challenge-desc { color: var(--text-dim); font-size: 13px; line-height: 1.6; margin: 0 0 16px; }
    .test-list { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text-dim); margin-bottom: 16px; line-height: 1.8; }
    .test-row { display: flex; align-items: center; gap: 8px; }
    .test-row .mark { width: 16px; }
    .test-row.pass { color: var(--green); }
    .test-row.fail { color: var(--magenta); }

    #golf-input {
      width: 100%;
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      padding: 12px 14px;
      background: #030405;
      border: 1px solid rgba(255,210,63,0.3);
      border-radius: 8px;
      color: var(--text);
      outline: none;
    }
    #golf-input:focus { border-color: var(--yellow); }
    .char-count { text-align: right; font-size: 11.5px; color: var(--text-dim); margin-top: 6px; }
    .result-box { margin-top: 16px; padding: 14px; border-radius: 8px; background: rgba(255,255,255,0.03); font-size: 13px; }
    .rating { font-family: 'Press Start 2P', monospace; font-size: 14px; margin-bottom: 8px; }
  </style>
</head>
<body>
  <div class="grid-bg" aria-hidden="true"></div>
  <header class="topbar">
    <a class="logo pixel" href="index.html">👾 DEV_ARCADE</a>
    <a class="back" href="index.html">← ARCADE</a>
  </header>

  <main>
    <div class="game-shell" style="max-width: 560px;">
      <h1 class="game-title" style="color: var(--yellow)">⛳ CODE GOLF</h1>
      <p class="game-sub">Write the shortest real JavaScript that passes every test. Fewer characters wins.</p>

      <div class="hud">
        <span>CHALLENGE <span class="val" id="challenge-num">1</span>/5</span>
        <span>BEST TOTAL <span class="val" id="best-total">—</span></span>
      </div>

      <div class="panel challenge-panel">
        <p class="challenge-title" id="challenge-title"></p>
        <p class="challenge-desc" id="challenge-desc"></p>
        <div class="test-list" id="test-list"></div>

        <input id="golf-input" type="text" spellcheck="false" autocomplete="off" placeholder="n => n % 2 === 0" />
        <p class="char-count"><span id="char-count">0</span> chars — par is <span id="par-count">0</span></p>

        <div class="row" style="margin-top: 14px;">
          <button id="run-btn" class="btn btn-cyan">▶ RUN</button>
          <button id="next-btn" class="btn btn-green" hidden>NEXT →</button>
        </div>

        <div id="result-box" class="result-box" hidden></div>
      </div>

      <div id="over-row" class="row" hidden>
        <button id="retry-btn" class="btn btn-cyan">↻ PLAY AGAIN</button>
        <a class="btn btn-ghost" href="index.html">ARCADE</a>
      </div>
    </div>
  </main>

  <script src="shared.js"></script>
  <script src="codegolf-data.js"></script>
  <script src="codegolf.js"></script>
</body>
</html>
