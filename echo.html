<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Echo — Dev Arcade</title>
  <meta name="description" content="A Simon-Says memory game built from real synthesized musical tones -- no audio files, just oscillators." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎵</text></svg>" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .pad-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      width: min(100%, 340px);
      margin: 0 auto 24px;
      aspect-ratio: 1;
    }
    .pad {
      border: none;
      border-radius: 16px;
      cursor: pointer;
      opacity: 0.35;
      transition: opacity 0.08s ease, transform 0.08s ease;
      filter: brightness(1);
    }
    .pad:disabled { cursor: default; }
    .pad.p0 { background: var(--cyan); }
    .pad.p1 { background: var(--magenta); }
    .pad.p2 { background: var(--green); }
    .pad.p3 { background: var(--yellow); }
    .pad.lit { opacity: 1; transform: scale(0.96); filter: brightness(1.6); box-shadow: 0 0 40px currentColor; }

    .center-status {
      text-align: center;
      margin-bottom: 18px;
      min-height: 24px;
      font-size: 13px;
      color: var(--text-dim);
    }
    .round-display {
      text-align: center;
      font-family: 'Press Start 2P', monospace;
      font-size: 15px;
      color: var(--cyan);
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <div class="grid-bg" aria-hidden="true"></div>
  <header class="topbar">
    <a class="logo pixel" href="index.html">👾 DEV_ARCADE</a>
    <a class="back" href="index.html">← ARCADE</a>
  </header>

  <main>
    <div class="game-shell">
      <h1 class="game-title" style="color: var(--cyan)">🎵 ECHO</h1>
      <p class="game-sub">Watch (and listen to) the pattern. Repeat it. Each round adds one more note.</p>

      <div class="hud">
        <span>ROUND <span class="val" id="round-val">0</span></span>
        <span>BEST <span class="val" id="best-val">0</span></span>
      </div>

      <div id="intro" class="panel center">
        <p style="color: var(--text-dim); font-size: 13px; margin-bottom: 20px;">4 pads, 4 real musical notes. Turn your sound on.</p>
        <button id="start-btn" class="btn btn-cyan">▶ START</button>
      </div>

      <div id="play" hidden>
        <p class="center-status" id="status-text">Watch closely…</p>
        <div class="pad-grid">
          <button class="pad p0" data-i="0" disabled></button>
          <button class="pad p1" data-i="1" disabled></button>
          <button class="pad p2" data-i="2" disabled></button>
          <button class="pad p3" data-i="3" disabled></button>
        </div>
      </div>

      <div id="done" class="panel center" hidden>
        <p class="pixel" style="font-size: 16px; color: var(--cyan); margin-bottom: 14px;">RUN COMPLETE</p>
        <p style="font-size: 32px; font-weight: 800; margin: 0 0 6px;" id="final-round">0</p>
        <p style="color: var(--text-dim); font-size: 12.5px; margin-bottom: 24px;">rounds survived</p>
        <p style="color: var(--text-dim); font-size: 12.5px; margin-bottom: 24px;" id="final-note"></p>
        <div class="row">
          <button id="retry-btn" class="btn btn-cyan">↻ PLAY AGAIN</button>
          <a class="btn btn-ghost" href="index.html">ARCADE</a>
        </div>
      </div>
    </div>
  </main>

  <script src="shared.js"></script>
  <script src="echo.js"></script>
</body>
</html>
