<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fact or Fiction — Dev Arcade</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔬</text></svg>" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .term-card { text-align: center; padding: 40px 24px; margin-bottom: 22px; }
    .term-name {
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(15px, 3.4vw, 18px);
      font-weight: 700;
      color: var(--yellow);
      line-height: 1.5;
    }
    .fact-box { margin-top: 16px; font-size: 13px; color: var(--text-dim); line-height: 1.6; text-align: left; padding: 14px; background: rgba(255,255,255,0.03); border-radius: 8px; }
    .verdict { font-family: 'Press Start 2P', monospace; font-size: 14px; margin-bottom: 10px; }
    .verdict.correct-v { color: var(--green); }
    .verdict.wrong-v { color: var(--magenta); }
  </style>
</head>
<body>
  <div class="grid-bg" aria-hidden="true"></div>
  <header class="topbar">
    <a class="logo pixel" href="index.html">👾 DEV_ARCADE</a>
    <a class="back" href="index.html">← ARCADE</a>
  </header>

  <main>
    <div class="game-shell">
      <h1 class="game-title" style="color: var(--yellow)">🔬 FACT OR FICTION</h1>
      <p class="game-sub">A claim appears. Real science, or a popular myth? One wrong answer ends the run.</p>

      <div class="hud">
        <span>STREAK <span class="val" id="streak-val">0</span></span>
        <span>BEST <span class="val" id="best-val">0</span></span>
      </div>

      <div class="panel term-card">
        <p id="verdict" class="verdict" hidden></p>
        <p class="term-name" id="term-name">—</p>
        <div id="fact-box" class="fact-box" hidden></div>
      </div>

      <div id="choice-row" class="row">
        <button id="real-btn" class="btn btn-green">✓ FACT</button>
        <button id="fake-btn" class="btn btn-magenta">✗ MYTH</button>
      </div>
      <div id="next-row" class="row" hidden>
        <button id="next-btn" class="btn btn-cyan">NEXT →</button>
      </div>
      <div id="over-row" class="row" hidden>
        <button id="retry-btn" class="btn btn-cyan">↻ TRY AGAIN</button>
        <a class="btn btn-ghost" href="index.html">ARCADE</a>
      </div>
    </div>
  </main>

  <script src="shared.js"></script>
  <script src="quiz-binary.js"></script>
  <script src="factfiction-data.js"></script>
  <script>BinaryQuiz({ items: SCIENCE_TRIVIA, statsKey: 'factfiction', trueLabel: 'FACT', falseLabel: 'MYTH', promptField: 'name', flagField: 'real' })</script>
</body>
</html>
