<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Neon Dash — Dev Arcade</title>
  <meta name="description" content="Dodge the falling glitches. Real-time canvas game with a glowing trail -- how long can you survive?" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .stage-wrap {
      position: relative;
      width: min(100%, 380px);
      margin: 0 auto 18px;
      touch-action: none;
    }
    #stage {
      width: 100%;
      aspect-ratio: 3 / 4.4;
      display: block;
      background: #030405;
      border: 1px solid rgba(0,240,255,0.25);
      border-radius: 12px;
      box-shadow: 0 0 30px -10px rgba(0,240,255,0.3);
    }
    .stage-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
      background: rgba(3,4,5,0.82);
      border-radius: 12px;
      text-align: center;
      padding: 20px;
    }
    .live-score {
      position: absolute;
      top: 12px; left: 50%;
      transform: translateX(-50%);
      font-family: 'Press Start 2P', monospace;
      font-size: 15px;
      color: var(--cyan);
      text-shadow: 0 0 12px currentColor;
      pointer-events: none;
    }
    .controls-hint { font-size: 11.5px; color: var(--text-dim); margin-top: -6px; }
  </style>
</head>
<body>
  <div class="grid-bg" aria-hidden="true"></div>
  <header class="topbar">
    <a class="logo pixel" href="index.html">👾 DEV_ARCADE</a>
    <a class="back" href="index.html">← ARCADE</a>
  </header>

  <main>
    <div class="game-shell">
      <h1 class="game-title" style="color: var(--magenta)">⚡ NEON DASH</h1>
      <p class="game-sub">Dodge the falling glitches. Arrow keys / A-D, or drag on mobile. Speed ramps up forever.</p>

      <div class="hud">
        <span>BEST <span class="val" id="best-val">0</span></span>
      </div>

      <div class="stage-wrap">
        <canvas id="stage"></canvas>
        <span class="live-score" id="live-score" hidden>0</span>
        <div id="overlay" class="stage-overlay">
          <p style="font-family:'Press Start 2P',monospace; font-size:14px; color: var(--magenta);" id="overlay-title">READY?</p>
          <p style="color: var(--text-dim); font-size: 12.5px; max-width: 260px;" id="overlay-note">Dodge left and right. Every glitch you survive makes the next one faster.</p>
          <button id="start-btn" class="btn btn-magenta">▶ START</button>
          <p class="controls-hint">← → or A / D — or drag on touch</p>
        </div>
      </div>
    </div>
  </main>

  <script src="shared.js"></script>
  <script src="neondash.js"></script>
</body>
</html>
